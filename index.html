<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="3連電卓" />
  <meta name="theme-color" content="#ec6aa8" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>3連電卓 RISA Edition</title>
  <style>
    :root{
      --pink:#ee6eaa; --pink2:#f8b8d5; --ink:#24324a; --line:#e7eaf0;
      --panel:#ffffff; --bg:#f6f7fb; --key:#f8f9fb; --key2:#e9edf4;
      --shadow:0 10px 28px rgba(37,47,67,.12); --r:18px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#fbe1ef 0%,#f5f7fb 45%,#eef3fb 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
    body{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
    .app{max-width:1600px;margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 4px 14px}
    .brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#f388bb,#d9498d);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
    h1{font-size:22px;margin:0;line-height:1.15}.sub{font-size:12px;color:#6a7280;margin-top:3px}
    .actions{display:flex;gap:8px}.topbtn{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;color:#45506a;box-shadow:0 3px 12px rgba(37,47,67,.08)}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
    .calc{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
    .calc-head{padding:12px 14px;background:linear-gradient(180deg,#fff 0,#fff7fb 100%);border-bottom:1px solid #f0e2ea}
    .calc-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.calc-title strong{font-size:15px}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#ffe5f1;color:#b13c75;font-weight:700}
    .display{margin-top:8px;background:#fbfcfe;border:1px solid #dfe4ec;border-radius:14px;padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums;min-height:72px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
    .expr{font-size:13px;color:#8891a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}.value{font-size:34px;line-height:1.1;font-weight:700;white-space:nowrap;overflow:auto hidden;scrollbar-width:none}.value::-webkit-scrollbar{display:none}
    .textrow{margin-top:10px;display:flex;gap:8px}.textrow input{width:100%;min-width:0;border:1px solid #dfe4ec;background:white;border-radius:12px;padding:11px 12px;font-size:15px;outline:none}.textrow input:focus{border-color:#ed7caf;box-shadow:0 0 0 3px rgba(237,124,175,.15)}
    .textrow button{flex:0 0 auto;border:0;border-radius:12px;background:#f2f4f8;color:#566174;font-weight:700;padding:0 12px}
    .history{height:138px;overflow:auto;border-top:1px solid #eef0f4;border-bottom:1px solid #eef0f4;background:#fff;padding:8px 12px}
    .history-empty{font-size:13px;color:#a0a7b3;padding:8px 0}.hist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px dashed #edf0f4;align-items:center}.hist:last-child{border-bottom:0}.hist .left{min-width:0}.hist .note{font-size:12px;color:#687285;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist .formula{font-size:13px;color:#8790a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist .result{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
    .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#fff}
    .key{min-height:56px;border:0;border-radius:13px;background:linear-gradient(#fff,#eef1f6);box-shadow:inset 0 0 0 1px #d9dee7,0 2px 4px rgba(37,47,67,.09);font-size:22px;font-weight:700;color:#2f4d79}.key:active{transform:translateY(1px);filter:brightness(.97)}
    .key.op{background:linear-gradient(#f5f0ff,#e7dcff);color:#6f47a8}.key.eq{background:linear-gradient(#f58cbd,#df4e93);color:#fff;box-shadow:none}.key.clear{background:linear-gradient(#fff0f3,#ffdce6);color:#c74369}.key.small{font-size:16px}.span2{grid-column:span 2}
    .foot{padding:10px 14px 14px;font-size:11px;color:#8992a0;text-align:center}
    @media (orientation:portrait), (max-width:900px){.grid{grid-template-columns:1fr}.history{height:110px}.pad{grid-template-columns:repeat(4,1fr)}.key{min-height:58px}.topbar{position:sticky;top:max(0px,env(safe-area-inset-top));z-index:5;background:rgba(246,247,251,.88);backdrop-filter:blur(12px);border-radius:16px;padding:8px 8px 12px;margin-bottom:4px}}
    @media (min-width:901px) and (max-height:850px){.history{height:105px}.key{min-height:49px}.display{min-height:64px}.value{font-size:30px}}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">3×</div><div><h1>3連電卓</h1><div class="sub">型番・メモも残せる iPad用</div></div></div>
    <div class="actions"><button class="topbtn" id="clearAll">全消去</button></div>
  </div>
  <main class="grid" id="grid"></main>
</div>
<script>
const calcStates = [0,1,2].map(()=>({expr:'',display:'0',note:'',history:[]}));
let active = 0;
const ops = ['+','-','×','÷'];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeExpr(e){return e.replaceAll('×','*').replaceAll('÷','/');}
function safeEval(e){
  const x=normalizeExpr(e);
  if(!/^[0-9+\-*/.()\s]+$/.test(x)) throw new Error();
  const v=Function('"use strict";return ('+x+')')();
  if(!Number.isFinite(v)) throw new Error();
  return Math.round((v+Number.EPSILON)*1e10)/1e10;
}
function render(){
  document.getElementById('grid').innerHTML = calcStates.map((s,i)=>`
    <section class="calc" data-i="${i}">
      <div class="calc-head">
        <div class="calc-title"><strong>電卓 ${i+1}</strong><span class="badge">LIST ${i+1}</span></div>
        <div class="display"><div class="expr">${esc(s.expr || ' ')}</div><div class="value">${esc(s.display)}</div></div>
        <div class="textrow"><input data-note="${i}" value="${esc(s.note)}" placeholder="型番・商品名・メモ（例：NA-LX129DL）" autocomplete="off" autocapitalize="characters" spellcheck="false"><button data-save="${i}">保存</button></div>
      </div>
      <div class="history">${s.history.length?s.history.map(h=>`<div class="hist"><div class="left"><div class="note">${esc(h.note||'メモなし')}</div><div class="formula">${esc(h.expr)}</div></div><div class="result">${esc(h.result)}</div></div>`).join(''):'<div class="history-empty">計算履歴と型番メモがここに残ります</div>'}</div>
      <div class="pad">
        <button class="key clear small" data-k="AC" data-i="${i}">AC</button><button class="key small" data-k="⌫" data-i="${i}">⌫</button><button class="key op" data-k="÷" data-i="${i}">÷</button><button class="key op" data-k="×" data-i="${i}">×</button>
        <button class="key" data-k="7" data-i="${i}">7</button><button class="key" data-k="8" data-i="${i}">8</button><button class="key" data-k="9" data-i="${i}">9</button><button class="key op" data-k="-" data-i="${i}">−</button>
        <button class="key" data-k="4" data-i="${i}">4</button><button class="key" data-k="5" data-i="${i}">5</button><button class="key" data-k="6" data-i="${i}">6</button><button class="key op" data-k="+" data-i="${i}">＋</button>
        <button class="key" data-k="1" data-i="${i}">1</button><button class="key" data-k="2" data-i="${i}">2</button><button class="key" data-k="3" data-i="${i}">3</button><button class="key eq" data-k="=" data-i="${i}" style="grid-row:span 2">＝</button>
        <button class="key span2" data-k="0" data-i="${i}">0</button><button class="key" data-k="." data-i="${i}">.</button>
      </div>
      <div class="foot">Ver.1.0.0 RISA Edition</div>
    </section>`).join('');
  bind();
}
function save(){localStorage.setItem('tripleCalcRisa',JSON.stringify(calcStates));}
function load(){try{const d=JSON.parse(localStorage.getItem('tripleCalcRisa'));if(Array.isArray(d)&&d.length===3)d.forEach((x,i)=>Object.assign(calcStates[i],x));}catch(e){}}
function press(i,k){
  active=i; const s=calcStates[i];
  if(k==='AC'){s.expr='';s.display='0';}
  else if(k==='⌫'){s.expr=s.expr.slice(0,-1);s.display=s.expr||'0';}
  else if(k==='='){
    if(!s.expr)return;
    try{const r=safeEval(s.expr);s.history.unshift({note:s.note.trim(),expr:s.expr+' =',result:String(r)});s.history=s.history.slice(0,30);s.display=String(r);s.expr=String(r);}catch(e){s.display='Error';}
  } else if(ops.includes(k)){
    if(!s.expr && k==='-') s.expr='-';
    else if(s.expr && !ops.includes(s.expr.slice(-1))) s.expr+=k;
    s.display=s.expr||'0';
  } else {
    if(s.display==='Error'){s.expr='';s.display='0';}
    s.expr+=k;s.display=s.expr;
  }
  save();render();
}
function bind(){
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(+b.dataset.i,b.dataset.k));
  document.querySelectorAll('[data-note]').forEach(inp=>{
    inp.onfocus=()=>active=+inp.dataset.note;
    inp.oninput=e=>{calcStates[+inp.dataset.note].note=e.target.value;save();};
  });
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const i=+b.dataset.save;calcStates[i].history.unshift({note:calcStates[i].note.trim(),expr:'メモ',result:'保存'});calcStates[i].history=calcStates[i].history.slice(0,30);save();render();});
  document.querySelectorAll('.calc').forEach(c=>c.onclick=()=>active=+c.dataset.i);
}
document.getElementById('clearAll').onclick=()=>{if(confirm('3つの電卓と履歴をすべて消去しますか？')){calcStates.forEach(s=>Object.assign(s,{expr:'',display:'0',note:'',history:[]}));save();render();}};
document.addEventListener('keydown',e=>{
  const tag=document.activeElement?.tagName;
  if(tag==='INPUT')return;
  const map={'Enter':'=','=':'=','Backspace':'⌫','Escape':'AC','/':'÷','*':'×','+':'+','-':'-','.':'.'};
  const k=/^[0-9]$/.test(e.key)?e.key:map[e.key]; if(k){e.preventDefault();press(active,k)}
});
load();render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
