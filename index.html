<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="nojima 3連電卓">
<meta name="theme-color" content="#ee4b92">
<link rel="manifest" href="manifest.webmanifest?v=2.8.0">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2.8.0">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2.8.0">
<title>nojima 3連電卓</title>
<style>
:root{--bg1:#d92a72;--bg2:#f46eaa;--bg3:#f9bbd5;--accent:#ee3d89;--accentDark:#a91455;--text:#3a2430;--muted:#906b7c;--line:#efd0dd;--shadow:0 5px 14px rgba(87,12,50,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:var(--bg1)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit} button{touch-action:manipulation;cursor:pointer}
.app{height:100svh;display:grid;grid-template-rows:52px minmax(0,1fr);gap:6px;padding:6px;background:radial-gradient(circle at 25% 0%,rgba(255,255,255,.20),transparent 28%),linear-gradient(155deg,var(--bg3),var(--bg2) 30%,var(--bg1))}
.topbar{display:flex;align-items:center;gap:8px;color:#fff;padding:0 8px;min-width:0}.version{font-size:12px;font-weight:700;opacity:.95;margin-right:auto}.brand{display:flex;align-items:center;gap:8px;min-width:0}.brand-name{font-size:clamp(26px,3.4vw,40px);line-height:1;font-weight:850;letter-spacing:-1.4px;text-shadow:0 2px 3px rgba(103,13,53,.36)}.mascot{width:34px;height:34px;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(80,7,38,.22))}.gear{width:42px;height:42px;border:1px solid rgba(255,255,255,.55);border-radius:12px;background:linear-gradient(#ff91bf,#e83983);color:#fff;font-size:24px;box-shadow:var(--shadow)}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:7px}.lists{min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;min-height:0}
.list-card{min-width:0;min-height:0;display:grid;grid-template-rows:54px minmax(0,1fr) 48px;background:linear-gradient(#fff8fb,#fff);border:2px solid rgba(255,255,255,.55);border-radius:18px;box-shadow:inset 0 0 0 2px rgba(213,35,109,.16),var(--shadow);overflow:hidden}.list-card.active{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--accentDark),var(--shadow)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;background:linear-gradient(#ffd3e5,#f69ec2);border-bottom:1px solid #e986ad}.list-title{font-size:21px;font-weight:850;color:#961446}.total{font-size:24px;font-weight:850;color:#111;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows{min-height:0;overflow:auto;background:rgba(255,255,255,.84);overscroll-behavior:contain}
.row{height:46px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 10px;position:relative;transition:transform .12s ease, background .12s ease}
.row.selected{background:#d7d7de;box-shadow:inset 4px 0 0 var(--accent)}.row .label{min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .token{font-size:18px;font-weight:800;color:#111;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:58px;text-align:right}.row.empty .label{color:#c8a7b6}.row.empty .label:after{content:""}.row.swiping{background:linear-gradient(90deg,#ffd6e8,#fff0f6)}
.list-footer{padding:5px;background:#ffd5e6}.ac{width:100%;height:38px;border:1px solid #ce2f71;border-radius:12px;background:linear-gradient(#ff89bb,#ec3e87);color:#fff;font-size:22px;font-weight:850}
.control{min-height:0;display:grid;grid-template-rows:36px 42px 36px minmax(0,1fr);gap:5px;background:linear-gradient(160deg,rgba(255,135,183,.9),rgba(218,36,111,.9));border:2px solid rgba(255,255,255,.4);border-radius:18px;padding:7px;box-shadow:var(--shadow);position:relative}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tab{border:1px solid #d86093;border-radius:10px;background:linear-gradient(#fff,#ffe5f0);font-size:16px;font-weight:800;color:#2570da}.tab.active{background:linear-gradient(#5e8cff,#3f6fe0);color:#ffff5b}
.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.mem{border:1px solid #c42768;border-radius:10px;background:linear-gradient(#ff83b5,#ea3a84);color:#fff;font-size:19px;font-weight:850}
.status{display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-radius:10px;background:rgba(255,255,255,.8);font-size:13px;color:#6b4256}.status strong{font-size:16px;color:#111}
.keypad{min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,minmax(0,1fr));gap:5px}.key{min-height:40px;border:1px solid #e39ab8;border-radius:11px;background:linear-gradient(#fff,#ffeaf3);color:#4063a9;font-size:26px;font-weight:750;box-shadow:inset 0 2px 0 #fff,0 2px 5px rgba(85,9,41,.16)}.key.op{background:linear-gradient(#70707b,#4d4d58);color:#fff;border-color:#3e3e47}.key.eq{background:linear-gradient(#4f4f58,#2d2d37);color:#fff;font-size:34px}.key.pink{background:linear-gradient(#ff69a7,#e83a82);color:#fff;border-color:#c82a6a}.key.small{font-size:17px}
.settings{position:absolute;right:7px;top:7px;width:255px;background:rgba(255,250,252,.99);border:1px solid #e4a5bf;border-radius:14px;box-shadow:0 12px 30px rgba(78,8,38,.32);padding:11px;z-index:30;display:none}.settings.open{display:block}.settings h3{margin:0 0 9px;text-align:center;font-size:16px}.setting-section{border-top:1px solid #efd1dd;padding-top:9px;margin-top:7px}.setting-label{font-size:13px;font-weight:700;margin-bottom:7px}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.swatch{border:2px solid transparent;border-radius:9px;padding:3px;background:#fff}.swatch.selected{border-color:#a01955}.swatch i{display:block;height:28px;border-radius:7px}.swatch span{display:block;font-size:10px;text-align:center;margin-top:3px}.switchrow{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px}.switch{width:44px;height:25px;border-radius:999px;background:#c8c8cf;padding:3px;border:0}.switch:after{content:"";display:block;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:var(--accent)}.switch.on:after{transform:translateX(19px)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:#2f2730;color:#fff;border-radius:999px;padding:9px 15px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){html,body{overflow:auto}.app{height:auto;min-height:100svh}.workspace{grid-template-columns:1fr}.control{order:2;min-height:520px}.lists{order:1;grid-template-columns:1fr}.list-card{min-height:500px}.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--bg2),var(--bg1));border-radius:0 0 15px 15px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="version">Ver.2.8.0</div>
    <div class="brand"><div class="brand-name">nojima</div><img class="mascot" src="mascot.png?v=2.8.0" alt="コンサルくん"></div>
    <button class="gear" id="gear" aria-label="設定">⚙</button>
  </header>
  <main class="workspace">
    <section class="lists" id="lists"></section>
    <aside class="control">
      <div class="tabs" id="tabs"></div>
      <div class="memory"><button class="mem" data-action="mc">MC</button><button class="mem" data-action="mplus">M+</button><button class="mem" data-action="mminus">M−</button></div>
      <div class="status"><span id="statusText">行を選んで入力</span><strong id="statusValue">0</strong></div>
      <div class="keypad" id="keypad">
        <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key op" data-key="÷">÷</button>
        <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key op" data-key="×">×</button>
        <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key op" data-key="−">−</button>
        <button class="key" data-key="0">0</button><button class="key" data-key="00">00</button><button class="key" data-key=".">.</button><button class="key pink" data-key="+">＋</button>
        <button class="key op" data-key="C">C</button><button class="key op" data-key="back">⌫</button><button class="key op small" data-key="±">+/−</button><button class="key eq" data-key="=">＝</button>
      </div>
      <div class="settings" id="settings"><h3>設定</h3><div class="setting-section"><div class="setting-label">テーマカラー</div><div class="swatches" id="swatches"></div></div><div class="setting-section"><div class="switchrow"><span>サウンド</span><button class="switch" id="soundSwitch"></button></div></div><div class="setting-section"><div class="switchrow"><span>シンプル操作</span><strong>ON</strong></div><div class="switchrow"><span>バージョン</span><strong>2.8.0</strong></div></div></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const THEMES={pink:{label:'Pink',vars:{'--bg1':'#d92a72','--bg2':'#f46eaa','--bg3':'#f9bbd5','--accent':'#ee3d89','--accentDark':'#a91455'}},blue:{label:'Blue',vars:{'--bg1':'#1264c5','--bg2':'#4b9cf0','--bg3':'#c9e6ff','--accent':'#2b86df','--accentDark':'#0d4d9c'}},green:{label:'Green',vars:{'--bg1':'#2c8f45','--bg2':'#68ba72','--bg3':'#d5f0d7','--accent':'#3ca457','--accentDark':'#236d34'}},purple:{label:'Purple',vars:{'--bg1':'#6b42ad','--bg2':'#a375db','--bg3':'#e8d8fb','--accent':'#8b5cc5','--accentDark':'#5a348f'}}};
const MIN_ROWS=14;const fresh=()=>({title:'',memory:0,rows:[],undo:[],redo:[],activeRow:null});
let state={active:2,theme:'pink',sound:false,lists:[fresh(),fresh(),fresh()]};
function load(){try{const keys=['nojima3calc-v2.6','nojima3calc-v2.5','nojima3calc-v2.4','nojima3calc-v2.3','nojima3calc-v2.2','nojima3calc-v2.1'];for(const k of keys){const d=JSON.parse(localStorage.getItem(k));if(d&&Array.isArray(d.lists)&&d.lists.length===3){state={...state,...d,lists:d.lists.map(l=>({...fresh(),...l,activeRow:Number.isInteger(l.activeRow)?l.activeRow:null,rows:(l.rows||[]).map(r=>({label:r.label||'',token:r.token||r.amount||''}))}))};break}}}catch(e){}}
function save(){localStorage.setItem('nojima3calc-v2.6',JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function fmt(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('ja-JP',{maximumFractionDigits:10}):String(v||'')}
function parseNum(s){const n=Number(String(s).replace(/,/g,''));return Number.isFinite(n)?n:null}
function ensureRow(l,idx){while(l.rows.length<=idx)l.rows.push({label:'',token:''});return l.rows[idx]}
function rowEmpty(r){return !(r && ((r.label||'')!=='' || (r.token||'')!==''))}
function tokenInfo(token){const t=String(token||'').trim();if(!t) return {type:'empty'};const m=t.match(/^([+−×÷])(.*)$/);if(m){return {type:'op',op:m[1],num:parseNum(m[2]),rawNum:m[2]}};return {type:'num',num:parseNum(t)}}
function totalFor(l){let total=null;for(const r of l.rows){const info=tokenInfo(r.token);if(info.type==='empty') continue;if(info.type==='num'&&info.num!==null){if(total===null) total=info.num; else total+=info.num;} else if(info.type==='op'&&info.num!==null){if(total===null){if(info.op==='−') total=-info.num; else total=info.num;} else if(info.op==='+') total+=info.num; else if(info.op==='−') total-=info.num; else if(info.op==='×') total*=info.num; else if(info.op==='÷') total/=info.num;}}
return total===null?0:Math.round((total+Number.EPSILON)*1e10)/1e10}
function snapshot(i){const l=state.lists[i];l.undo.push(JSON.stringify({title:l.title,memory:l.memory,rows:l.rows,activeRow:l.activeRow}));if(l.undo.length>40)l.undo.shift();l.redo=[]}
function restore(i,redo=false){const l=state.lists[i];const from=redo?l.redo:l.undo;const to=redo?l.undo:l.redo;if(!from.length) return;to.push(JSON.stringify({title:l.title,memory:l.memory,rows:l.rows,activeRow:l.activeRow}));Object.assign(l,JSON.parse(from.pop()));save();render()}
function beep(){if(!state.sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=520;g.gain.value=.03;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.03)}catch(e){}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1100)}
function current(){return state.lists[state.active]}
function currentRow(){const l=current();return Number.isInteger(l.activeRow)?ensureRow(l,l.activeRow):null}
function applyTheme(){const t=THEMES[state.theme]||THEMES.pink;Object.entries(t.vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));document.querySelector('meta[name="theme-color"]').content=t.vars['--accent']}
function renderTabs(){document.getElementById('tabs').innerHTML=[0,1,2].map(i=>`<button type="button" class="tab ${state.active===i?'active':''}" data-tab="${i}">List${i+1}</button>`).join('')}
function renderSettings(){const colors={pink:'#ee3d89',blue:'#2b86df',green:'#3ca457',purple:'#8b5cc5'};document.getElementById('swatches').innerHTML=Object.keys(THEMES).map(k=>`<button type="button" class="swatch ${state.theme===k?'selected':''}" data-theme="${k}"><i style="background:${colors[k]}" ></i><span>${THEMES[k].label}</span></button>`).join('');document.getElementById('soundSwitch').classList.toggle('on',state.sound)}
function renderStatus(){const l=current(),r=currentRow();document.getElementById('statusText').textContent=r?`List${state.active+1} ${l.activeRow+1}行目`:'行を選んで入力';document.getElementById('statusValue').textContent=fmt(totalFor(l))}
function renderLists(){document.getElementById('lists').innerHTML=state.lists.map((l,i)=>{const count=Math.max(MIN_ROWS,l.rows.length);let rows='';for(let idx=0;idx<count;idx++){const r=l.rows[idx]||{label:'',token:''};const empty=rowEmpty(r);rows+=`<div class="row ${state.active===i&&l.activeRow===idx?'selected':''} ${empty?'empty':''}" data-row="${idx}" data-list="${i}"><div class="label">${r.label?esc(r.label):''}</div><div class="token">${esc(r.token)}</div></div>`;}return `<article class="list-card ${state.active===i?'active':''}" data-card="${i}"><div class="list-head"><div class="list-title">List${i+1}</div><div class="total">${fmt(totalFor(l))}</div></div><div class="rows">${rows}</div><div class="list-footer"><button type="button" class="ac" data-clear="${i}">AC</button></div></article>`}).join('')}
function render(){applyTheme();renderTabs();renderSettings();renderLists();renderStatus();bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{state.active=+x.dataset.tab;save();render()});document.querySelectorAll('[data-card]').forEach(x=>x.onclick=e=>{if(e.target.closest('button,.row'))return;state.active=+x.dataset.card;save();render()});document.querySelectorAll('[data-row]').forEach(x=>attachRowEvents(x));document.querySelectorAll('[data-clear]').forEach(x=>x.onclick=()=>clearList(+x.dataset.clear));document.querySelectorAll('[data-theme]').forEach(x=>x.onclick=()=>{state.theme=x.dataset.theme;save();render();toast('テーマを変更しました')})}
function attachRowEvents(el){const i=+el.dataset.list, idx=+el.dataset.row;let sx=0,sy=0,moved=false;el.onclick=()=>selectRow(i,idx);el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;moved=false;el.classList.remove('swiping')},{passive:true});el.addEventListener('touchmove',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx, dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy) && dx< -18){moved=true;el.classList.add('swiping');el.style.transform=`translateX(${Math.max(dx,-70)}px)`;}},{passive:true});el.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx;el.style.transform='';el.classList.remove('swiping');if(moved && dx<-55){deleteRow(i,idx);return;} if(Math.abs(dx)<10)selectRow(i,idx);},{passive:true})}
function selectRow(i,idx){state.active=i;const l=state.lists[i];if(l.activeRow===idx){l.activeRow=null;save();render();return}ensureRow(l,idx);l.activeRow=idx;save();render()}
function deleteRow(i,idx){const l=state.lists[i];if(idx>=l.rows.length || rowEmpty(l.rows[idx])) return;snapshot(i);l.rows.splice(idx,1);if(l.activeRow===idx) l.activeRow=null;else if(Number.isInteger(l.activeRow)&&l.activeRow>idx) l.activeRow--;save();render();toast('行を削除しました')}
function clearList(i){if(!confirm('List'+(i+1)+'をすべて消去しますか？'))return;state.lists[i]=fresh();save();render()}
function setToken(row,token){row.token=token}
function appendDigit(row,k){let t=String(row.token||'');if(!t){t=k==='.'?'0.':k}else{const info=tokenInfo(t);if(info.type==='op'){let n=info.rawNum||'';if(k==='.'&&!n.includes('.')) n+=(n===''?'0.':'.'); else if(k!=='.') n+=(n==='0'?'':k); t=info.op+n;}else{if(k==='.'&&!t.includes('.')) t+='.'; else if(k!=='.') t+=(t==='0'?'':k);}}
row.token=t}
function backspaceRow(row){let t=String(row.token||'');if(!t) return; t=t.slice(0,-1); row.token=t; if(row.token==='-') row.token='−';}
function toggleSignRow(row){let t=String(row.token||'');const info=tokenInfo(t);if(info.type==='op'){let n=String(info.rawNum||'');if(n.startsWith('-')) n=n.slice(1); else n='-'+n; row.token=info.op+n;}else{if(t.startsWith('-')) row.token=t.slice(1); else row.token='-'+t;}}
function nextRowWithOp(op){const l=current(); const curIdx=l.activeRow; if(!Number.isInteger(curIdx)) return; const nextIdx=curIdx+1; ensureRow(l,nextIdx).token=op; l.activeRow=nextIdx; }
function press(k){beep(); const l=current(); if(k==='undo'){restore(state.active,false);return} if(k==='redo'){restore(state.active,true);return} if(k==='cycle'){toast('機能準備中');return} let row=currentRow(); if(!row){ selectRow(state.active,0); row=currentRow(); }
 snapshot(state.active);
 if(k==='C'){row.token=''; save(); render(); return}
 if(k==='back'){backspaceRow(row); save(); render(); return}
 if(k==='±'){toggleSignRow(row); save(); render(); return}
 if(k==='='){ // if current row is bare operator, keep it. just refresh total
 save(); render(); toast('合計を更新しました'); return}
 if(/^\d+$/.test(k) || k==='.'){
   appendDigit(row,k); save(); render(); return
 }
 if(['+','−','×','÷'].includes(k)){
   const info=tokenInfo(row.token);
   if(info.type==='empty'){row.token=k; save(); render(); return}
   if(info.type==='op' && (info.rawNum||'')===''){row.token=k; save(); render(); return}
   nextRowWithOp(k); save(); render(); return
 }
 if(k==='plusrow'){nextRowWithOp('+'); save(); render(); return}
 }
function memAction(a){const l=current();const v=totalFor(l);if(a==='mc')l.memory=0;if(a==='mplus')l.memory+=v;if(a==='mminus')l.memory-=v;save();renderStatus();toast(a==='mc'?'メモリーをクリア':'メモリー '+fmt(l.memory))}
document.getElementById('keypad').onclick=e=>{const b=e.target.closest('[data-key]');if(b)press(b.dataset.key)};document.querySelector('.memory').onclick=e=>{const b=e.target.closest('[data-action]');if(b)memAction(b.dataset.action)};document.getElementById('gear').onclick=()=>document.getElementById('settings').classList.toggle('open');document.getElementById('soundSwitch').onclick=()=>{state.sound=!state.sound;save();renderSettings();beep()};document.addEventListener('pointerdown',e=>{const s=document.getElementById('settings');if(s.classList.contains('open')&&!s.contains(e.target)&&!document.getElementById('gear').contains(e.target))s.classList.remove('open')});document.addEventListener('keydown',e=>{const target=e.target; if(target.tagName==='INPUT' || target.tagName==='TEXTAREA') return; const m={'Enter':'=','=':'=','Escape':'C','Backspace':'back','/':'÷','*':'×','-':'−','+':'+','.':'.'}; const k=/^[0-9]$/.test(e.key)?e.key:m[e.key]; if(k){e.preventDefault();press(k)}});
load();render();
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js?v=2.8.0',{updateViaCache:'none'});
      await reg.update();
      if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'});}
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!sessionStorage.getItem('v280reloaded')){sessionStorage.setItem('v280reloaded','1');location.reload();}});
    }catch(e){}
  });
}
</script>
</body>
</html>
